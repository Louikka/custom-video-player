<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Video player test</title>

    <link rel="stylesheet" href="./modern-normalize.css" />

    <style>
        html {
            height : 100%;
        }

        body {
            height : 100%;
            background-color : rgb(27, 27, 27);
        }

        video, video-player {
            width : 100%;
            height : 100%;
            display : block;
        }
    </style>

    <script src="../dist/video-player.iife.js"></script>
</head>



<body>
    <div style="width:100%;height:100%;display:flex;justify-content:center">
        <div style="max-width:100dvw;max-height:100dvh">
            <video-player src="./video.mp4" controls></video-player>
        </div>
    </div>

    <script>
        VideoPlayer.addElementToCanvas((() =>
        {
            const e = document.createElement('button');
            e.textContent = 'Test button';
            e.style = `
                position : absolute;
                top : 100px;
                left : 200px;
            `;

            e.onclick = () =>
            {
                const player = document.querySelector('video-player');
                const video = player?.shadowRoot.querySelector('video');
                if (video) video.currentTime += 5;
            }

            return e;
        })(), 1, 10);
    </script>
</body>

</html>
