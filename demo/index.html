<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Video player test</title>

    <link rel="stylesheet" href="./modern-normalize.css" />

    <script src="../dist/video-player.iife.js"></script>

    <style>
        html {
            height : 100%;
        }

        body {
            height : 100%;
            background-color : rgb(27, 27, 27);
        }

        video, video-player {
            width : 100%;
            height : 100%;
            display : block;
        }
    </style>
</head>



<body>
    <div style="width:100%;height:100%;display:flex;justify-content:center">
        <div style="max-width:100dvw;max-height:100dvh">
            <video-player id="player" src="./video.mp4" controls>
                <!-- <source src="./video.mp4" /> -->
            </video-player>
        </div>
    </div>

    <script>
        /** @type {VideoPlayerElement} */
        const e = document.getElementById('player');

        e.canvas.addChild((() =>
        {
            const e = document.createElement('button');
            e.textContent = 'My button';
            return e;
        })(), { showAt: 1, hideAt: 5 });

        e.currentTime = 6;

        e.addEventListener('timeupdate', (ev) => console.log(ev.currentTarget));
    </script>
</body>

</html>
